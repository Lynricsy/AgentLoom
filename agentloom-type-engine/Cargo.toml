[package]
name = "agentloom-type-engine"
version = "0.1.0"
edition = "2024"
description = "AgentLoom Type Engine - WASM-powered type compatibility checker"
license = "GPL-3.0-only"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2.114"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-wasm-bindgen = "0.6"
js-sys = "0.3"

[dev-dependencies]
wasm-bindgen-test = "0.3"
criterion = { version = "0.5", default-features = false }

[[bench]]
name = "compatibility_bench"
harness = false

[profile.release]
opt-level = "z"
lto = true
