<style>
/* ============================================================
   深色主题：只覆盖 :root 颜色变量 + 少数需要反向处理的规则。
   排版尺寸一律不动，与浅色版逐页对应。

   关键点：背景挂在 html 上而不是 body 上。CSS 规范规定根元素的
   背景会传播到整个画布，因此它会铺满含页边距的整页；挂在 body
   上则页边距区域仍是白的，深色页面周围会出现白框。
   ============================================================ */
:root{
  /* 正文不用纯白：深底上纯白眩光重，长文阅读疲劳 */
  --ink:#d7d8d4; --soft:#9b9d98; --faint:#6e716c; --lead:#c6c8c3;
  /* 分隔线要能看见但不抢注意力 */
  --line:#33363c;
  /* 行内代码与术语框底色：比页面底稍亮，形成层次 */
  --wash:#22252b;
  /* 强调色提亮：浅色版的 #1f5fa8 在深底上几乎看不见 */
  --accent:#78b0f0; --warn:#e0885c;
  /* 页面底色不用纯黑：纯黑与浅色文字对比过强 */
  --paper:#15171c;
  /* 代码块比页面底略深，卡片比页面底略亮 */
  --code-bg:#101216; --card-bg:#1b1e24;
}

/* 标题下的粗分隔线：浅色版用 --ink（近黑），深色版用它会变成亮白粗线，
   过于抢眼，改用中灰 */
h1{border-bottom-color:#4a4e56}
th{border-bottom-color:#4a4e56}

/* 表格斑马纹在深色下更有助于横向读行 */
tbody tr:nth-child(even){background:#191c21}

/* 代码块里的注释色需要单独压暗，否则与正文抢焦点 */
pre .cm{color:#6e716c}

/* 术语框左边框在深底上要更实一点才看得出是一个块 */
.termbox{border-left-color:var(--accent)}
.problem{border-left-color:var(--warn)}

/* 类比框：浅色版靠 1px 细边 + 顶部 2px 粗边区分，
   深色版细边几乎看不见，改为略亮的底色承担区分 */
.analogy{border-color:#33363c; border-top-color:#797d86}

/* 封面页脚线 */
.cover .meta{border-top-color:#33363c}

/* 部分分隔页的说明文字 */
.part p{color:var(--soft)}
</style>
