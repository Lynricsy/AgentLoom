name: agentloom_mobile
description: AgentLoom - Multi-Agent Workflow Orchestration Mobile Companion
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.2.1
  # go_router 18 / cached_network_image 4 / freezed 4 均要求 Dart ^3.12.0，
  # 而 .fvmrc 钉的 Flutter 3.41.2 自带 Dart 3.11.0，pub solver 明确拒绝。
  go_router: ^17.5.0
  dio: ^5.9.2
  freezed_annotation: ^3.1.0
  json_annotation: ^4.11.0
  flutter_dotenv: ^6.0.1
  flutter_secure_storage: ^11.0.0
  socket_io_client: ^3.1.4
  firebase_core: ^4.14.0
  firebase_messaging: ^16.6.0
  flutter_local_notifications: ^22.3.0
  url_launcher: ^6.3.1
  flutter_markdown_plus: ^1.0.7
  flutter_smooth_markdown: ^0.7.2
  cached_network_image: ^3.4.1
  file_picker: ^12.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  freezed: ^3.1.0
  build_runner: ^2.4.15
  json_serializable: ^6.9.5
  mocktail: ^1.0.4
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - .env.dev
    - .env.staging
    - .env.prod
    - assets/branding/logo-transparent.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/branding/logo-transparent.png
  min_sdk_android: 21
  adaptive_icon_background: '#FFFFFF'
  adaptive_icon_foreground: assets/branding/logo-transparent.png
  adaptive_icon_foreground_inset: 16
  remove_alpha_ios: true
  background_color_ios: '#FFFFFF'
  web:
    generate: true
    image_path: assets/branding/logo-transparent.png
    background_color: '#FFFFFF'
    theme_color: '#FFFFFF'
