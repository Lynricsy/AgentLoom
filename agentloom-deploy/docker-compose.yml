name: ${COMPOSE_PROJECT_NAME:-agentloom-private}

x-server-app: &server-app
  image: ${SERVER_IMAGE:-agentloom/server:private-local}
  build:
    context: ..
    dockerfile: agentloom-deploy/docker/server.Dockerfile
  restart: unless-stopped
  environment: &server-env
    APP_PORT: ${APP_PORT:-3000}
    APP_NODE_ENV: ${APP_NODE_ENV:-production}
    APP_DEPLOYMENT_MODE: ${APP_DEPLOYMENT_MODE:-private}
    APP_DATABASE_URL: ${APP_DATABASE_URL:-postgresql://agentloom:change-me-db-password@postgres:5432/agentloom}
    APP_SUPABASE_URL: ${APP_SUPABASE_URL:-}
    APP_SUPABASE_ANON_KEY: ${APP_SUPABASE_ANON_KEY:-}
    APP_SUPABASE_SERVICE_KEY: ${APP_SUPABASE_SERVICE_KEY:-}
    APP_JWT_SECRET: ${APP_JWT_SECRET:-change-me-jwt-secret}
    APP_REDIS_URL: ${APP_REDIS_URL:-redis://:change-me-redis-password@redis:6379/0}
    APP_MASTER_ENCRYPTION_KEY: ${APP_MASTER_ENCRYPTION_KEY:-REPLACE_WITH_BASE64_32_BYTES}
    APP_PRIVATE_DEPLOYMENT_LICENSE_PUBLIC_KEY: ${APP_PRIVATE_DEPLOYMENT_LICENSE_PUBLIC_KEY:-}
    APP_OAUTH_REDIRECT_URL: ${APP_OAUTH_REDIRECT_URL:-http://localhost:8080/api/v1/auth/oauth/callback}
    APP_FRONTEND_URL: ${APP_FRONTEND_URL:-http://localhost:8080}
    APP_MINIO_ENDPOINT: ${APP_MINIO_ENDPOINT:-minio}
    APP_MINIO_PORT: ${APP_MINIO_PORT:-9000}
    APP_MINIO_ACCESS_KEY: ${APP_MINIO_ACCESS_KEY:-agentloom}
    APP_MINIO_SECRET_KEY: ${APP_MINIO_SECRET_KEY:-change-me-minio-password}
    APP_MINIO_USE_SSL: ${APP_MINIO_USE_SSL:-false}
    APP_MINIO_BUCKET: ${APP_MINIO_BUCKET:-agentloom-documents}
    APP_QDRANT_URL: ${APP_QDRANT_URL:-http://qdrant:6333}
    APP_FIRECRACKER_RUNTIME_URL: ${APP_FIRECRACKER_RUNTIME_URL:-https://firecracker-runtime:8443}
    APP_FIRECRACKER_RUNTIME_CA: /run/secrets/firecracker-manager-ca
    APP_FIRECRACKER_RUNTIME_CERT: /run/secrets/firecracker-client-cert
    APP_FIRECRACKER_RUNTIME_KEY: /run/secrets/firecracker-client-key
    APP_FIRECRACKER_RUNTIME_SERVER_NAME: ${APP_FIRECRACKER_RUNTIME_SERVER_NAME:-firecracker-runtime}
    APP_SANDBOX_MAINTENANCE_MODE: ${APP_SANDBOX_MAINTENANCE_MODE:-false}
    APP_SANDBOX_ROLLBACK_HOURS: ${APP_SANDBOX_ROLLBACK_HOURS:-168}
    APP_SANDBOX_NODE_ADMIN_TENANT_IDS: ${APP_SANDBOX_NODE_ADMIN_TENANT_IDS:-}
    FIREBASE_SERVICE_ACCOUNT: ${FIREBASE_SERVICE_ACCOUNT:-}
  secrets:
    - firecracker-manager-ca
    - firecracker-client-cert
    - firecracker-client-key
  networks:
    - frontend_net
    - app_net
    - supabase_net
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    minio:
      condition: service_healthy
    qdrant:
      condition: service_healthy
    firecracker-runtime:
      condition: service_healthy

x-studio-app: &studio-app
  image: ${STUDIO_IMAGE:-agentloom/studio:private-local}
  build:
    context: ..
    dockerfile: agentloom-deploy/docker/studio.Dockerfile
  restart: unless-stopped
  environment: &studio-env
    VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
    VITE_AUTOSAVE_DEBOUNCE_MS: ${VITE_AUTOSAVE_DEBOUNCE_MS:-500}
    VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:-}
    VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY:-}
  networks:
    - frontend_net

services:
  reverse-proxy:
    image: ${NGINX_IMAGE:-openresty/openresty:alpine}
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
      studio:
        condition: service_healthy
      docs:
        condition: service_healthy
    ports:
      - '${NGINX_HTTP_PORT:-8080}:80'
    volumes:
      - ./nginx.conf:/usr/local/openresty/nginx/conf/nginx.conf:ro
    networks:
      - frontend_net
      - supabase_net
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'wget -q -O /dev/null http://127.0.0.1/healthz || exit 1',
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  server-migrator:
    image: ${SERVER_IMAGE:-agentloom/server:private-local}-migrator
    build:
      context: ..
      dockerfile: agentloom-deploy/docker/server.Dockerfile
      target: migrator
    environment: *server-env
    networks:
      - app_net
      - data_net
      - supabase_net
    profiles:
      - tools

  studio:
    <<: *studio-app
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'if command -v curl >/dev/null 2>&1; then curl -fsS http://127.0.0.1:8080/ >/dev/null; else wget -q -O /dev/null http://127.0.0.1:8080/; fi',
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  docs:
    image: ${DOCS_IMAGE:-agentloom/docs:private-local}
    build:
      context: ..
      dockerfile: agentloom-deploy/docker/docs.Dockerfile
    restart: unless-stopped
    networks:
      - frontend_net
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'wget -q -O /dev/null http://127.0.0.1:8081/documentation/ || exit 1',
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  server:
    <<: *server-app
    command: ['node', 'dist/src/main.js']
    environment:
      <<: *server-env
      APP_SANDBOX_CALLBACK_BASE_URL: ${APP_SANDBOX_CALLBACK_BASE_URL_SERVER:-http://server:3000/api/v1}
    expose:
      - '3000'
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('http').get('http://127.0.0.1:3000/api/v1/health', (res) => process.exit(res.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  worker:
    <<: *server-app
    command: ['node', 'dist/src/main.js']
    environment:
      <<: *server-env
      APP_SANDBOX_CALLBACK_BASE_URL: ${APP_SANDBOX_CALLBACK_BASE_URL_WORKER:-http://worker:3000/api/v1}
    networks:
      - app_net
      - supabase_net
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('http').get('http://127.0.0.1:3000/api/v1/health', (res) => process.exit(res.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  firecracker-runtime:
    image: ${FIRECRACKER_RUNTIME_IMAGE:-agentloom/firecracker-runtime:1.16.1}
    build:
      context: ..
      dockerfile: agentloom-deploy/firecracker/runtime-manager.Dockerfile
    restart: unless-stopped
    stop_grace_period: 60s
    privileged: true
    pid: host
    cgroup: host
    read_only: true
    environment:
      FIRECRACKER_MANAGER_LISTEN: 0.0.0.0:8443
      FIRECRACKER_STATE_ROOT: /var/lib/agentloom-firecracker
      FIRECRACKER_CHROOT_BASE: /fc
      FIRECRACKER_ARTIFACT_ROOT: /opt/agentloom-firecracker/artifacts
      FIRECRACKER_CNI_TEMPLATE: /etc/agentloom-firecracker/network/10-agentloom-firecracker.conflist.template
      FIRECRACKER_GUEST_CIDR: ${FIRECRACKER_GUEST_CIDR:-172.30.0.0/16}
      FIRECRACKER_GATEWAY: ${FIRECRACKER_GATEWAY:-172.30.0.1}
      FIRECRACKER_EGRESS_ALLOWED_PRIVATE_CIDRS: ${FIRECRACKER_EGRESS_ALLOWED_PRIVATE_CIDRS:-}
      FIRECRACKER_CALLBACK_ALLOWED_HOSTS: ${FIRECRACKER_CALLBACK_ALLOWED_HOSTS:-server,worker}
      FIRECRACKER_MANAGER_TLS_CERT: /run/secrets/firecracker-manager-cert
      FIRECRACKER_MANAGER_TLS_KEY: /run/secrets/firecracker-manager-key
      FIRECRACKER_MANAGER_CLIENT_CA: /run/secrets/firecracker-client-ca
      FIRECRACKER_GUEST_CA: /run/secrets/firecracker-guest-ca
      FIRECRACKER_GUEST_CA_KEY: /run/secrets/firecracker-guest-ca-key
      FIRECRACKER_GUEST_SERVER_NAME: ${FIRECRACKER_GUEST_SERVER_NAME:-agentloom-guest}
      FIRECRACKER_MAX_VMS: ${FIRECRACKER_MAX_VMS:-20}
      FIRECRACKER_MAX_VCPU: ${FIRECRACKER_MAX_VCPU:-20}
      FIRECRACKER_MAX_MEMORY_MIB: ${FIRECRACKER_MAX_MEMORY_MIB:-40960}
      FIRECRACKER_MAX_DISK_GIB: ${FIRECRACKER_MAX_DISK_GIB:-200}
      FIRECRACKER_ALLOW_UNSUPPORTED_KERNEL: ${FIRECRACKER_ALLOW_UNSUPPORTED_KERNEL:-false}
      FIRECRACKER_SMT_POLICY: ${FIRECRACKER_SMT_POLICY:-deny}
      FIRECRACKER_ENV: ${FIRECRACKER_ENV:-production}
      FIRECRACKER_ALLOW_SWAP: ${FIRECRACKER_ALLOW_SWAP:-false}
    expose:
      - '8443'
    volumes:
      - firecracker_state:/var/lib/agentloom-firecracker
      - /dev/kvm:/dev/kvm
      - /dev/net/tun:/dev/net/tun
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs:
      - /run:rw,nosuid,nodev,mode=0755
      - /var/lib/cni:rw,nosuid,nodev,noexec,mode=0700
      - /tmp:rw,nosuid,nodev,noexec,mode=1777
    secrets:
      - firecracker-manager-cert
      - firecracker-manager-ca
      - firecracker-manager-key
      - firecracker-client-ca
      - firecracker-guest-ca
      - firecracker-guest-ca-key
      - firecracker-health-client-cert
      - firecracker-health-client-key
    networks:
      - app_net
      - sandbox_egress_net
    deploy:
      resources:
        limits:
          cpus: '${FIRECRACKER_RUNTIME_CPU_LIMIT:-24}'
          memory: ${FIRECRACKER_RUNTIME_MEMORY_LIMIT:-48G}
    healthcheck:
      test:
        [
          'CMD',
          'curl',
          '--fail',
          '--silent',
          '--show-error',
          '--resolve',
          'firecracker-runtime:8443:127.0.0.1',
          '--cacert',
          '/run/secrets/firecracker-manager-ca',
          '--cert',
          '/run/secrets/firecracker-health-client-cert',
          '--key',
          '/run/secrets/firecracker-health-client-key',
          'https://firecracker-runtime:8443/readyz',
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  sandbox-cutover:
    profiles: ['migration']
    image: ${FIRECRACKER_RUNTIME_IMAGE:-agentloom/firecracker-runtime:1.16.1}
    build:
      context: ..
      dockerfile: agentloom-deploy/firecracker/runtime-manager.Dockerfile
    entrypoint: ['/usr/local/bin/sandbox-cutover']
    environment:
      <<: *server-env
      APP_SANDBOX_MAINTENANCE_MODE: 'true'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    secrets:
      - firecracker-manager-ca
      - firecracker-client-cert
      - firecracker-client-key
    networks:
      - app_net
      - supabase_net
    depends_on:
      firecracker-runtime:
        condition: service_healthy

  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agentloom}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-db-password}
      POSTGRES_DB: ${POSTGRES_DB:-agentloom}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app_net
      - data_net
      - supabase_net
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: ${REDIS_IMAGE:-redis:7-alpine}
    restart: unless-stopped
    command: ['sh', '-c', 'exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"']
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-change-me-redis-password}
    volumes:
      - redis_data:/data
    networks:
      - app_net
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "$${REDIS_PASSWORD}" ping | grep PONG >/dev/null || exit 1']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  minio:
    image: ${MINIO_IMAGE:-minio/minio:RELEASE.2025-02-28T09-55-16Z}
    restart: unless-stopped
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: ${APP_MINIO_ACCESS_KEY:-agentloom}
      MINIO_ROOT_PASSWORD: ${APP_MINIO_SECRET_KEY:-change-me-minio-password}
    ports:
      - '127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001'
    volumes:
      - minio_data:/data
    networks:
      - app_net
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'if command -v curl >/dev/null 2>&1; then curl -fsS http://127.0.0.1:9000/minio/health/live >/dev/null; else wget -q -O /dev/null http://127.0.0.1:9000/minio/health/live; fi',
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 15s

  qdrant:
    image: ${QDRANT_IMAGE:-qdrant/qdrant:v1.17.0}
    restart: unless-stopped
    ports:
      - '127.0.0.1:${QDRANT_HTTP_PORT:-6333}:6333'
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - app_net
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'bash -c "echo -e \"GET /readyz HTTP/1.0\r\nHost: localhost\r\n\r\n\" > /dev/tcp/localhost/6333"',
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s

  createbuckets:
    image: ${MC_IMAGE:-minio/mc:RELEASE.2025-05-21T01-59-54Z}
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - app_net
    environment:
      MINIO_ROOT_USER: ${APP_MINIO_ACCESS_KEY:-agentloom}
      MINIO_ROOT_PASSWORD: ${APP_MINIO_SECRET_KEY:-change-me-minio-password}
      MINIO_BUCKET: ${APP_MINIO_BUCKET:-agentloom-documents}
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc alias set loom http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        mc mb --ignore-existing loom/"$$MINIO_BUCKET"
        echo "Bucket '$$MINIO_BUCKET' ready"
    restart: 'no'

volumes:
  postgres_data:
  redis_data:
  minio_data:
  qdrant_data:
  firecracker_state:

networks:
  frontend_net:
    name: agentloom-frontend
  app_net:
    name: agentloom-app
    internal: true
  data_net:
    name: agentloom-data
    internal: true
  sandbox_egress_net:
    name: agentloom-sandbox-egress
  supabase_net:
    name: ${SUPABASE_NETWORK:-supabase-shared}
    external: true
secrets:
  firecracker-manager-cert:
    file: ${FIRECRACKER_MANAGER_CERT_FILE:-./secrets/firecracker/manager.crt}
  firecracker-manager-key:
    file: ${FIRECRACKER_MANAGER_KEY_FILE:-./secrets/firecracker/manager.key}
  firecracker-manager-ca:
    file: ${FIRECRACKER_MANAGER_CA_FILE:-./secrets/firecracker/manager-ca.crt}
  firecracker-client-ca:
    file: ${FIRECRACKER_CLIENT_CA_FILE:-./secrets/firecracker/client-ca.crt}
  firecracker-client-cert:
    file: ${FIRECRACKER_CLIENT_CERT_FILE:-./secrets/firecracker/app-client.crt}
  firecracker-client-key:
    file: ${FIRECRACKER_CLIENT_KEY_FILE:-./secrets/firecracker/app-client.key}
  firecracker-health-client-cert:
    file: ${FIRECRACKER_HEALTH_CLIENT_CERT_FILE:-./secrets/firecracker/health-client.crt}
  firecracker-health-client-key:
    file: ${FIRECRACKER_HEALTH_CLIENT_KEY_FILE:-./secrets/firecracker/health-client.key}
  firecracker-guest-ca:
    file: ${FIRECRACKER_GUEST_CA_FILE:-./secrets/firecracker/guest-ca.crt}
  firecracker-guest-ca-key:
    file: ${FIRECRACKER_GUEST_CA_KEY_FILE:-./secrets/firecracker/guest-ca.key}
