worker_processes auto;
error_log /usr/local/openresty/nginx/logs/error.log warn;
pid /usr/local/openresty/nginx/logs/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    # Docker embedded DNS，用于在容器重建换 IP 后按服务名重新解析上游。
    resolver 127.0.0.11 ipv6=off valid=10s;
    resolver_timeout 5s;

    # ── 安全头（全局） ──────────────────────────────────────────
    add_header X-Content-Type-Options  "nosniff"         always;
    add_header X-Frame-Options         "SAMEORIGIN"      always;
    add_header X-XSS-Protection        "1; mode=block"   always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy      "camera=(), microphone=(), geolocation=()" always;

    # WebSocket upgrade map
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 80;
        server_name _;
        client_max_body_size 50m;

        # Health check
        location = /healthz {
            return 200 'ok';
            add_header Content-Type text/plain;
        }

        # WebSocket (Socket.IO) — core real-time channel for execution,
        # agent conversation, notifications, knowledge, and memory namespaces
        location /socket.io/ {
            set $server_upstream server:3000;
            proxy_pass http://$server_upstream$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # API — SSE 流式响应需要关闭缓冲 + 延长超时
        location /api/ {
            set $server_upstream server:3000;
            proxy_pass http://$server_upstream$request_uri;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # 关闭代理缓冲，确保 SSE/agent-conversation 流式即时推送
            proxy_buffering off;
            proxy_cache off;

            # LLM 长时推理可能超过默认 60s，设为 5 分钟
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;

            # 禁用 gzip 以避免 SSE 流被缓冲
            proxy_set_header Accept-Encoding "";
        }

        # Documentation site (VitePress, base: /documentation/)
        location /documentation/ {
            set $docs_upstream docs:8081;
            proxy_pass http://$docs_upstream$request_uri;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Supabase Auth (GoTrue via Kong)
        location /auth/ {
            set $supabase_kong_upstream supabase-kong:8000;
            proxy_pass http://$supabase_kong_upstream$request_uri;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header apikey $http_apikey;
            proxy_set_header Authorization $http_authorization;
        }

        # Swagger UI (passthrough to server at /docs)
        location /docs {
            set $server_upstream server:3000;
            proxy_pass http://$server_upstream$request_uri;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Studio (default, SPA fallback)
        location / {
            set $studio_upstream studio:8080;
            proxy_pass http://$studio_upstream$request_uri;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # HTML 不缓存（确保环境变量注入生效）
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        }

        # 带 hash 的静态资源长缓存
        location /assets/ {
            set $studio_upstream studio:8080;
            proxy_pass http://$studio_upstream$request_uri;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Vite 文件名含 hash，内容变则名变，安全长缓存
            add_header Cache-Control "public, max-age=31536000, immutable" always;
        }
    }
}
