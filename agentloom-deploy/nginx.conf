worker_processes auto;
error_log /usr/local/openresty/nginx/logs/error.log warn;
pid /usr/local/openresty/nginx/logs/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    # ── 安全头（全局） ──────────────────────────────────────────
    add_header X-Content-Type-Options  "nosniff"         always;
    add_header X-Frame-Options         "SAMEORIGIN"      always;
    add_header X-XSS-Protection        "1; mode=block"   always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy      "camera=(), microphone=(), geolocation=()" always;

    # WebSocket upgrade map
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Upstreams
    upstream server {
        server server:3000;
        keepalive 32;
    }

    upstream studio {
        server studio:8080;
        keepalive 32;
    }

    upstream docs {
        server docs:8081;
        keepalive 32;
    }

    server {
        listen 80;
        server_name _;
        client_max_body_size 50m;

        # Health check
        location = /healthz {
            return 200 'ok';
            add_header Content-Type text/plain;
        }

        # WebSocket (Socket.IO) — core real-time channel for execution,
        # agent conversation, notifications, knowledge, and memory namespaces
        location /socket.io/ {
            proxy_pass http://server;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # API — SSE 流式响应需要关闭缓冲 + 延长超时
        location /api/ {
            proxy_pass http://server;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # 关闭代理缓冲，确保 SSE/agent-conversation 流式即时推送
            proxy_buffering off;
            proxy_cache off;

            # LLM 长时推理可能超过默认 60s，设为 5 分钟
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;

            # 禁用 gzip 以避免 SSE 流被缓冲
            proxy_set_header Accept-Encoding "";
        }

        # Documentation site (VitePress, base: /documentation/)
        location /documentation/ {
            proxy_pass http://docs;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Swagger UI (passthrough to server at /docs)
        location /docs {
            proxy_pass http://server;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Studio (default, SPA fallback)
        location / {
            proxy_pass http://studio;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
