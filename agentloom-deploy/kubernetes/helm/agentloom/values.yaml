nameOverride: ""
fullnameOverride: ""

imagePullSecrets: []

ingress:
  enabled: true
  className: nginx
  annotations: {}
  host: agentloom.local
  tls:
    enabled: false
    secretName: ""

env:
  shared:
    APP_PORT: "3000"
    APP_NODE_ENV: production
    APP_DEPLOYMENT_MODE: private
    APP_DATABASE_URL: ""
    APP_REDIS_URL: ""
    APP_MINIO_ENDPOINT: ""
    APP_MINIO_PORT: ""
    APP_MINIO_ACCESS_KEY: ""
    APP_MINIO_SECRET_KEY: ""
    APP_MINIO_USE_SSL: "false"
    APP_MINIO_BUCKET: agentloom-documents
    APP_QDRANT_URL: ""
    APP_FIRECRACKER_RUNTIME_URL: ""
    APP_FIRECRACKER_RUNTIME_CA: /run/secrets/firecracker/manager-ca.crt
    APP_FIRECRACKER_RUNTIME_CERT: /run/secrets/firecracker/app-client.crt
    APP_FIRECRACKER_RUNTIME_KEY: /run/secrets/firecracker/app-client.key
    APP_FIRECRACKER_RUNTIME_SERVER_NAME: firecracker-runtime
    APP_SANDBOX_MAINTENANCE_MODE: "false"
    APP_SANDBOX_ROLLBACK_HOURS: "168"
  server:
    APP_JWT_SECRET: change-me-jwt-secret
    APP_MASTER_ENCRYPTION_KEY: REPLACE_WITH_BASE64_32_BYTES
    APP_OAUTH_REDIRECT_URL: https://agentloom.example.com/api/v1/auth/oauth/callback
    APP_FRONTEND_URL: https://agentloom.example.com
    APP_SUPABASE_URL: ""
    APP_SUPABASE_ANON_KEY: ""
    APP_SUPABASE_SERVICE_KEY: ""
    APP_PRIVATE_DEPLOYMENT_LICENSE_PUBLIC_KEY: ""
    FIREBASE_SERVICE_ACCOUNT: ""
  studio:
    VITE_API_BASE_URL: /api/v1
    VITE_AUTOSAVE_DEBOUNCE_MS: "500"

server:
  replicaCount: 1
  image:
    repository: agentloom/server
    tag: private-local
    pullPolicy: IfNotPresent
  command:
    - node
    - dist/src/main.js
  service:
    port: 3000
  resources: {}
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 80
  nodeSelector: {}
  tolerations: []
  affinity: {}

worker:
  enabled: true
  replicaCount: 1
  resources: {}
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 80
  nodeSelector: {}
  tolerations: []
  affinity: {}

firecrackerRuntime:
  enabled: true
  # 多副本 = 多个沙箱运行时节点。每个 pod 需要所在 K8s node 具备 KVM，且各自
  # 拿到独立 PVC（volumeClaimTemplates 已保证）。副本以 headless service 的
  # 稳定 DNS 名 <pod>.<headless> 注册到 /api/v1/sandbox-nodes，
  # 证书 SAN 由 PKI 脚本的 FIRECRACKER_MANAGER_EXTRA_SANS 覆盖。
  replicas: 1
  image:
    repository: agentloom/firecracker-runtime
    tag: 1.16.1
    pullPolicy: IfNotPresent
  service:
    port: 8443
  managerPkiSecretName: agentloom-firecracker-manager-pki
  clientPkiSecretName: agentloom-firecracker-client-pki
  state:
    existingClaim: ""
    storageClassName: ""
    size: 250Gi
  guestCIDR: 172.30.0.0/16
  gateway: 172.30.0.1
  # 默认拒绝 guest 访问私网；仅为受管 private LLM/MCP 添加 IPv4 CIDR。
  allowedPrivateCIDRs: []
  maxVMs: "20"
  maxVCPU: "20"
  maxMemoryMiB: "40960"
  maxDiskGiB: "200"
  allowUnsupportedKernel: "false"
  smtPolicy: deny
  resources:
    limits:
      cpu: "24"
      memory: 48Gi
  nodeSelector: {}
  tolerations: []
  affinity: {}

studio:
  replicaCount: 1
  image:
    repository: agentloom/studio
    tag: private-local
    pullPolicy: IfNotPresent
  service:
    port: 80
    targetPort: 8080
  resources: {}
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 80
  nodeSelector: {}
  tolerations: []
  affinity: {}

postgres:
  enabled: true
  image:
    repository: postgres
    tag: 16-alpine
    pullPolicy: IfNotPresent
  auth:
    user: agentloom
    password: change-me-db-password
    database: agentloom
  service:
    port: 5432
  persistence:
    enabled: true
    existingClaim: ""
    storageClassName: ""
    size: 20Gi
  resources: {}

redis:
  enabled: true
  image:
    repository: redis
    tag: 7-alpine
    pullPolicy: IfNotPresent
  auth:
    password: change-me-redis-password
  service:
    port: 6379
  persistence:
    enabled: true
    existingClaim: ""
    storageClassName: ""
    size: 5Gi
  resources: {}

minio:
  enabled: true
  image:
    repository: minio/minio
    tag: latest
    pullPolicy: IfNotPresent
  auth:
    rootUser: agentloom
    rootPassword: change-me-minio-password
  service:
    apiPort: 9000
    consolePort: 9001
  persistence:
    enabled: true
    existingClaim: ""
    storageClassName: ""
    size: 50Gi
  resources: {}

qdrant:
  enabled: true
  image:
    repository: qdrant/qdrant
    tag: v1.17.0
    pullPolicy: IfNotPresent
  service:
    httpPort: 6333
    grpcPort: 6334
  persistence:
    enabled: true
    existingClaim: ""
    storageClassName: ""
    size: 20Gi
  resources: {}
