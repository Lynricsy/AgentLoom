apiVersion: v1
kind: Secret
metadata:
  name: {{ include "agentloom.fullname" . }}-server-secret
  labels:
    {{- include "agentloom.labels" . | nindent 4 }}
type: Opaque
stringData:
  APP_DATABASE_URL: {{ include "agentloom.databaseUrl" . | quote }}
  APP_REDIS_URL: {{ include "agentloom.redisUrl" . | quote }}
  APP_MINIO_ACCESS_KEY: {{ include "agentloom.minioAccessKey" . | quote }}
  APP_MINIO_SECRET_KEY: {{ include "agentloom.minioSecretKey" . | quote }}
  APP_JWT_SECRET: {{ .Values.env.server.APP_JWT_SECRET | quote }}
  APP_MASTER_ENCRYPTION_KEY: {{ .Values.env.server.APP_MASTER_ENCRYPTION_KEY | quote }}
  APP_SUPABASE_URL: {{ .Values.env.server.APP_SUPABASE_URL | quote }}
  APP_SUPABASE_ANON_KEY: {{ .Values.env.server.APP_SUPABASE_ANON_KEY | quote }}
  APP_SUPABASE_SERVICE_KEY: {{ .Values.env.server.APP_SUPABASE_SERVICE_KEY | quote }}
  APP_PRIVATE_DEPLOYMENT_LICENSE_PUBLIC_KEY: {{ .Values.env.server.APP_PRIVATE_DEPLOYMENT_LICENSE_PUBLIC_KEY | quote }}
  FIREBASE_SERVICE_ACCOUNT: {{ .Values.env.server.FIREBASE_SERVICE_ACCOUNT | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "agentloom.fullname" . }}-internal-secret
  labels:
    {{- include "agentloom.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_USER: {{ .Values.postgres.auth.user | quote }}
  POSTGRES_PASSWORD: {{ .Values.postgres.auth.password | quote }}
  POSTGRES_DB: {{ .Values.postgres.auth.database | quote }}
  REDIS_PASSWORD: {{ .Values.redis.auth.password | quote }}
  MINIO_ROOT_USER: {{ .Values.minio.auth.rootUser | quote }}
  MINIO_ROOT_PASSWORD: {{ .Values.minio.auth.rootPassword | quote }}
