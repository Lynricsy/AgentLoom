apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "agentloom.fullname" . }}-server-config
  labels:
    {{- include "agentloom.labels" . | nindent 4 }}
data:
  APP_PORT: {{ .Values.env.shared.APP_PORT | quote }}
  APP_NODE_ENV: {{ .Values.env.shared.APP_NODE_ENV | quote }}
  APP_DEPLOYMENT_MODE: {{ .Values.env.shared.APP_DEPLOYMENT_MODE | quote }}
  APP_MINIO_ENDPOINT: {{ include "agentloom.minioEndpoint" . | quote }}
  APP_MINIO_PORT: {{ include "agentloom.minioPort" . | quote }}
  APP_MINIO_USE_SSL: {{ .Values.env.shared.APP_MINIO_USE_SSL | quote }}
  APP_MINIO_BUCKET: {{ .Values.env.shared.APP_MINIO_BUCKET | quote }}
  APP_QDRANT_URL: {{ include "agentloom.qdrantUrl" . | quote }}
  APP_OAUTH_REDIRECT_URL: {{ .Values.env.server.APP_OAUTH_REDIRECT_URL | quote }}
  APP_FRONTEND_URL: {{ .Values.env.server.APP_FRONTEND_URL | quote }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "agentloom.fullname" . }}-studio-config
  labels:
    {{- include "agentloom.labels" . | nindent 4 }}
data:
  VITE_API_BASE_URL: {{ .Values.env.studio.VITE_API_BASE_URL | quote }}
  VITE_AUTOSAVE_DEBOUNCE_MS: {{ .Values.env.studio.VITE_AUTOSAVE_DEBOUNCE_MS | quote }}
