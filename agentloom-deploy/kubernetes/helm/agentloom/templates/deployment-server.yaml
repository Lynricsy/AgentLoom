apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "agentloom.serverFullname" . }}
  labels:
    {{- include "agentloom.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
spec:
  {{- if not .Values.server.autoscaling.enabled }}
  replicas: {{ .Values.server.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "agentloom.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: server
  template:
    metadata:
      labels:
        {{- include "agentloom.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: server
    spec:
      # SIGTERM 后进程停止拉取队列任务并等进行中的任务结束，与 Compose 的 stop_grace_period 一致
      terminationGracePeriodSeconds: 60
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: server
          image: {{ include "agentloom.serverImage" . | quote }}
          imagePullPolicy: {{ .Values.server.image.pullPolicy }}
          command:
            {{- include "agentloom.runtimeCommand" . | nindent 12 }}
          envFrom:
            - configMapRef:
                name: {{ include "agentloom.fullname" . }}-server-config
            - secretRef:
                name: {{ include "agentloom.fullname" . }}-server-secret
          env:
            - name: APP_SANDBOX_CALLBACK_BASE_URL
              value: {{ printf "http://%s:%v/api/v1" (include "agentloom.serverFullname" .) .Values.server.service.port | quote }}
          volumeMounts:
            - name: firecracker-pki
              mountPath: /run/secrets/firecracker
              readOnly: true
          ports:
            - name: http
              containerPort: {{ .Values.server.service.port }}
              protocol: TCP
          # liveness 不检查 PostgreSQL/Redis，依赖中断不会触发重启；只在 Redis 可用但队列 worker 卡死超过 2 分钟时失败
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 4
          # readiness 检查 PostgreSQL、Redis 与队列 worker（单项超时 2s），任一不可用即摘流
          readinessProbe:
            httpGet:
              path: /api/v1/health/ready
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.server.resources | nindent 12 }}
      volumes:
        - name: firecracker-pki
          secret:
            secretName: {{ .Values.firecrackerRuntime.clientPkiSecretName | quote }}
      nodeSelector:
        {{- toYaml .Values.server.nodeSelector | nindent 8 }}
      tolerations:
        {{- toYaml .Values.server.tolerations | nindent 8 }}
      affinity:
        {{- toYaml .Values.server.affinity | nindent 8 }}
