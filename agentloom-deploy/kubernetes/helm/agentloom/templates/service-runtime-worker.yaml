{{- if .Values.firecrackerRuntime.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "agentloom.firecrackerRuntimeFullname" . }}
  labels:
    {{- include "agentloom.labels" . | nindent 4 }}
    app.kubernetes.io/component: firecracker-runtime
spec:
  type: ClusterIP
  selector:
    {{- include "agentloom.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: firecracker-runtime
  ports:
    - name: https
      port: {{ .Values.firecrackerRuntime.service.port }}
      targetPort: https
      protocol: TCP
{{- end }}
{{- if .Values.worker.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "agentloom.workerFullname" . }}
  labels:
    {{- include "agentloom.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  type: ClusterIP
  selector:
    {{- include "agentloom.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: worker
  ports:
    - name: http
      port: {{ .Values.server.service.port }}
      targetPort: http
      protocol: TCP
{{- end }}
