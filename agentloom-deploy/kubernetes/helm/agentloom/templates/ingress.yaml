{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "agentloom.fullname" . }}
  labels:
    {{- include "agentloom.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.ingress.host | quote }}
      secretName: {{ .Values.ingress.tls.secretName | quote }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ include "agentloom.serverFullname" . }}
                port:
                  number: {{ .Values.server.service.port }}
          - path: /socket.io
            pathType: Prefix
            backend:
              service:
                name: {{ include "agentloom.serverFullname" . }}
                port:
                  number: {{ .Values.server.service.port }}
          {{- if .Values.minio.enabled }}
          # 预签名下载（知识库原文、证据导出）：SigV4 签了 Host 与路径，原样转给 MinIO
          - path: /{{ .Values.env.shared.APP_MINIO_BUCKET }}
            pathType: Prefix
            backend:
              service:
                name: {{ include "agentloom.minioFullname" . }}
                port:
                  number: {{ .Values.minio.service.apiPort }}
          {{- end }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "agentloom.studioFullname" . }}
                port:
                  number: {{ .Values.studio.service.port }}
{{- end }}
