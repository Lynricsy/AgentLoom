name: ci

on:
  push:
    branches: [main]
  pull_request: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # 版本取根 package.json 的 packageManager
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck:all
      # 不含 server E2E（需要 Docker 与 Redis），E2E 仍在本地运行
      - run: pnpm test:all
      # 文档站构建：Markdown 中未转义的 <占位符> 会被 Vue 当作标签，docs:check 发现不了，只有构建会失败。
      # agentloom-docs 不在 pnpm workspace 内（自带 lockfile，与 docs 镜像一致），需在目录内单独安装
      - run: pnpm install --frozen-lockfile && pnpm build
        working-directory: agentloom-docs
