packages:
  - agentloom-server
  - agentloom-studio
  - agentloom-contracts
  - agentloom-api-client
  - agentloom-plugin-sdk
  - agentloom-plugin-cli
  - agentloom-plugin-template

# 各包原先分散声明的构建脚本白名单在此收敛为并集。
allowBuilds:
  '@firebase/util': false
  '@google/genai': false
  '@nestjs/core': false
  '@openapitools/openapi-generator-cli': true
  '@scarf/scarf': false
  '@swc/core': true
  cpu-features: false
  esbuild: true
  msgpackr-extract: false
  protobufjs: false
  ssh2: false
  tree-sitter: true

# 强制 Radix 内部包收敛成单一实例。
# cmdk@1.1.1 固定依赖 @radix-ui/react-dialog@1.1.15，与直接依赖的 1.1.23 并存时，
# react-focus-scope / react-dismissable-layer / react-focus-guards 等会被装成两份。
# 这些包持有模块级全局栈（focusScopesStack、层级栈），两份各自维护状态会导致
# Radix Select 放进 Radix Dialog 时两个 FocusScope 互抢焦点并无限递归（浏览器卡死）。
overrides:
  '@radix-ui/react-dialog': '^1.1.23'

  # server 与 @llamaindex/qdrant 各自解析 qdrant client 会装成两份；
  # 1.17.0 是 server 代码实际适配的版本（1.19 移除了 search API）。
  '@qdrant/js-client-rest': 1.17.0

# 跨包统一版本。
# 例外：agentloom-plugin-sdk 的 zod 保持 3.x（面向插件生态兼容），不引用 catalog。
catalog:
  '@types/node': ^22.10.7
  typescript: ~5.9.3
  vitest: ^4.0.18

  # zod 钉在 4.4.x：4.5.0 起 `toJSONSchema` 默认用 draft-2020-12 表示可空
  # （`type: ['string','null']`，4.4 及以前是 `anyOf: [..., {type:'null'}]`）。
  # nestjs-zod@5.5.0 的 `cleanupOpenApiDoc` 只认 anyOf 那一种形状，数组形透传；
  # 更糟的是 `SwaggerModule.createDocument` 会把数组形 `type` 当成 Nest 的
  # `type: [String]`（数组元素类型）约定，于是 `z.string().nullable()` 被导出成
  # `{type:'array',items:{type:'string'}}` —— 可空信息在 createDocument 内部就已
  # 丢失且与真正的 `z.array(z.string())` 无法区分，导出后再做任何后处理都救不回来。
  # 后果：`sdk/openapi.json` 自称 3.0.0 却带 3.1 语法，openapi-generator 校验失败，
  # `pnpm contracts:regen` 断链；models.ts 里 `activatedAt: string | null` 会被
  # 错生成为 `Array<string>`。nestjs-zod 跟进 zod 4.5 输出后再解开此钉。
  zod: ~4.4.3
